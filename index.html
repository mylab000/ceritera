        }, { onConflict: 'user_id' }).then(() => {});

      try {
        currentColorTheme = localStorage.getItem('ceriteraColorTheme') || 'koral';
        currentDarkMode = localStorage.getItem('ceriteraDarkMode') === '1';
      } catch (e) {}
      applyThemeToDOM();
    })();

    // ---------- Library rendering ----------
    function getFilteredBooks() {
      return featuredBooks.filter(b => {
        const matchesLang = currentLangFilter === 'ALL' || b.lang === currentLangFilter;
        const q = currentSearchQuery.toLowerCase().trim();
        const matchesSearch = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
        return matchesLang && matchesSearch;
      });
    }

    function renderLibrary() {
      const filtered = getFilteredBooks();
      const totalPages = Math.max(1, Math.ceil(filtered.length / booksPerPage));
      if (currentPage > totalPages) currentPage = totalPages;
      const startIdx = (currentPage - 1) * booksPerPage;
      const pageBooks = filtered.slice(startIdx, startIdx + booksPerPage);

      const grid = document.getElementById('bookGrid');
      if (pageBooks.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; opacity:0.7;">Tiada buku dijumpai.</p>';
      } else {
        grid.innerHTML = pageBooks.map(book => {
          const realIdx = featuredBooks.indexOf(book);
          const flag = book.lang === 'BM' ? '🇲🇾' : '🇬🇧';
          const icon = book.emoji || '📘';
          return `
            <div class="book-card" onclick="openReader(${realIdx})" style="position:relative;">
              <button type="button" class="book-card-menu-btn" onclick="event.stopPropagation(); confirmDeleteBook('${book.id}');" title="Padam buku">✕</button>
              <div>
                <span class="book-card-icon">${icon}</span>
                <div class="book-title">${escapeHtml(book.title)}</div>
                <div class="book-meta">${escapeHtml(book.author)}</div>
              </div>
              <span class="book-tag">${flag} ${book.lang} &middot; ${book.chapters.length} bab</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('pageIndicator').textContent = `Halaman ${currentPage} daripada ${totalPages}`;
      document.getElementById('prevPageBtn').disabled = currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function switchLanguage(lang) {
      currentLangFilter = lang;
      currentPage = 1;
      document.querySelectorAll('.btn-lang').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      renderLibrary();
      renderAppMenu();
    }

    function onSearch() {
      currentSearchQuery = document.getElementById('searchInput').value;
      currentPage = 1;
      renderLibrary();
    }

    function changePage(delta) {
      const filtered = getFilteredBooks();
      const totalPages = Math.max(1, Math.ceil(filtered.length / booksPerPage));
      const next = currentPage + delta;
      if (next < 1 || next > totalPages) return;
      currentPage = next;
      renderLibrary();
    }

    // ---------- Reader ----------
    async function openReader(bookIndex) {
      currentBookIndex = bookIndex;
      currentChapterIndex = 0;
      document.getElementById('libraryView').style.display = 'none';
      document.getElementById('readerView').style.display = 'block';
      document.body.classList.add('reading');
      const book = featuredBooks[bookIndex];
      if (currentUser && book && book.id) {
        const savedIdx = await cloudLoadProgress(book.id);
        if (savedIdx >= 0 && savedIdx < book.chapters.length) currentChapterIndex = savedIdx;
      }
      if (book) await loadBookmarkForBook(book);
      populateChapterSelect();
      renderChapter();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeReader() {
      document.getElementById('readerView').style.display = 'none';
      document.getElementById('libraryView').style.display = 'block';
      document.body.classList.remove('reading');
      currentBookIndex = null;
    }

    function populateChapterSelect() {
      const book = featuredBooks[currentBookIndex];
      const select = document.getElementById('chapterSelect');
      if (!book || !Array.isArray(book.chapters)) { select.innerHTML = ''; return; }
      select.innerHTML = book.chapters
        .map((ch, i) => `<option value="${i}">${escapeHtml(ch && ch.title ? ch.title : 'Bab ' + (i + 1) + ' (tiada tajuk)')}</option>`)
        .join('');
      select.value = currentChapterIndex;
    }

    function renderChapter() {
      const book = featuredBooks[currentBookIndex];
      if (!book || !Array.isArray(book.chapters) || book.chapters.length === 0) {
        console.error('renderChapter: buku atau senarai bab tidak sah untuk currentBookIndex =', currentBookIndex);
        return;
      }
      let chapter = book.chapters[currentChapterIndex];
      if (!chapter) {
        // The index is out of sync with the actual chapters array (e.g. data got
        // corrupted/truncated in a previous save). Recover instead of throwing
        // an uncaught error that silently stops execution with no feedback.
        console.error('renderChapter: bab pada index', currentChapterIndex, 'tidak wujud (buku ada', book.chapters.length, 'bab). Melaraskan ke bab terhampir yang sah.');
        currentChapterIndex = Math.max(0, Math.min(currentChapterIndex, book.chapters.length - 1));
        chapter = book.chapters[currentChapterIndex];
        if (!chapter) return;
      }

      document.getElementById('readerTitle').textContent = book.title;
      document.getElementById('readerAuthor').textContent = book.author;
      document.getElementById('chiNum').textContent = 'Bab ' + (currentChapterIndex + 1);
      document.getElementById('chiOf').textContent = 'daripada ' + book.chapters.length + (book.chapters.length === 1 ? ' bab' : ' bab');
      document.getElementById('readerContent').textContent = chapter.content || '';
      document.getElementById('readerContent').style.fontSize = currentFontSize + 'px';
      document.getElementById('chapterSelect').value = currentChapterIndex;

      const pct = book.chapters.length > 1 ? (currentChapterIndex / (book.chapters.length - 1)) * 100 : 100;
      document.getElementById('progressFill').style.width = pct + '%';

      document.getElementById('prevChapBtn').disabled = currentChapterIndex <= 0;
      document.getElementById('nextChapBtn').disabled = currentChapterIndex >= book.chapters.length - 1;

      updateBookmarkButton();
      if (currentUser && book.id) cloudSaveProgress(book.id, currentChapterIndex);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchChapter(idxStr) {
      currentChapterIndex = parseInt(idxStr, 10);
      renderChapter();
    }

    function navigateChapter(delta) {
      const book = featuredBooks[currentBookIndex];
      if (!book || !Array.isArray(book.chapters)) {
        console.error('navigateChapter: data buku tidak sah untuk currentBookIndex =', currentBookIndex);
        return;
      }
      const next = currentChapterIndex + delta;
      if (next < 0 || next >= book.chapters.length) return;
      currentChapterIndex = next;
      renderChapter();
    }

    function changeFontSize(delta) {
      currentFontSize = Math.max(12, Math.min(32, currentFontSize + delta));
      document.getElementById('readerContent').style.fontSize = currentFontSize + 'px';
    }

    // ==================== FOCUS MODE ====================
    function enterFocusMode() {
      const el = document.documentElement;
      const request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (request) {
        request.call(el).catch(() => {}); // some browsers (notably iOS Safari) may reject; button still works as visual toggle
      }
      document.getElementById('exitFocusBtn').style.display = 'block';
    }

    function exitFocusMode() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
      document.getElementById('exitFocusBtn').style.display = 'none';
    }

    // keep the exit button in sync if the user leaves fullscreen via Esc or browser controls directly
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('exitFocusBtn');
      if (btn) btn.style.display = document.fullscreenElement ? 'block' : 'none';
    });
    document.addEventListener('webkitfullscreenchange', () => {
      const btn = document.getElementById('exitFocusBtn');
      if (btn) btn.style.display = document.webkitFullscreenElement ? 'block' : 'none';
    });

    // ==================== BOOKMARK ====================
    let currentBookmarkedIndex = null; // bookmarked chapter index for the currently open book, or null

    async function toggleBookmark() {
      const book = featuredBooks[currentBookIndex];
      if (!book) return;
      if (currentBookmarkedIndex === currentChapterIndex) {
        currentBookmarkedIndex = null; // un-bookmark
      } else {
        currentBookmarkedIndex = currentChapterIndex;
      }
      updateBookmarkButton();
      if (currentUser && book.id) {
        try {
          await supabaseClient.from('ceritera_progress').upsert({
            user_id: currentUser.id, book_id: book.id, last_chapter_index: currentChapterIndex,
            bookmarked_chapter_index: currentBookmarkedIndex, updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,book_id' });
        } catch (e) { console.error('Gagal simpan tanda halaman', e); }
      } else {
        try {
          const key = 'ceriteraBookmark_' + book.id;
          if (currentBookmarkedIndex === null) localStorage.removeItem(key);
          else localStorage.setItem(key, String(currentBookmarkedIndex));
        } catch (e) {}
      }
    }

    function updateBookmarkButton() {
      const btn = document.getElementById('bookmark-btn');
      if (!btn) return;
      btn.classList.toggle('active', currentBookmarkedIndex === currentChapterIndex);
    }

    async function loadBookmarkForBook(book) {
      if (currentUser && book.id) {
        try {
          const { data } = await supabaseClient.from('ceritera_progress').select('bookmarked_chapter_index').eq('user_id', currentUser.id).eq('book_id', book.id).maybeSingle();
          currentBookmarkedIndex = (data && data.bookmarked_chapter_index !== null && data.bookmarked_chapter_index !== undefined) ? data.bookmarked_chapter_index : null;
        } catch (e) { currentBookmarkedIndex = null; }
      } else {
        try {
          const raw = localStorage.getItem('ceriteraBookmark_' + book.id);
          currentBookmarkedIndex = raw !== null ? parseInt(raw, 10) : null;
        } catch (e) { currentBookmarkedIndex = null; }
      }
    }

    // ==================== CLOUD SYNC ====================
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    async function cloudLoadBooks() {
      if (!supabaseClient || !currentUser) return null;
      const { data: books, error: booksErr } = await supabaseClient
        .from('ceritera_books').select('*').eq('user_id', currentUser.id).order('sort_order', { ascending: true });
      if (booksErr) { console.error('Gagal muat buku', booksErr); return null; }
      const { data: chapters, error: chErr } = await supabaseClient
        .from('ceritera_chapters').select('*').eq('user_id', currentUser.id).order('chapter_order', { ascending: true });
      if (chErr) { console.error('Gagal muat bab', chErr); return null; }
      return books.map(b => ({
        id: b.id,
        title: b.title,
        author: b.author,
        lang: b.lang,
        emoji: b.emoji,
        chapters: chapters.filter(c => c.book_id === b.id).map(c => ({ title: c.title, content: c.content }))
      }));
    }

    async function cloudCreateBook(book) {
      if (!supabaseClient || !currentUser) return null;
      const { data, error } = await supabaseClient.from('ceritera_books').insert({
        user_id: currentUser.id, title: book.title, author: book.author, lang: book.lang,
        emoji: book.emoji || '📘', sort_order: featuredBooks.length
      }).select('id').single();
      if (error) { console.error('Gagal cipta buku', error); return null; }
      const bookId = data.id;
      if (book.chapters && book.chapters.length) {
        const rows = book.chapters.map((c, i) => ({
          book_id: bookId, user_id: currentUser.id, chapter_order: i, title: c.title, content: c.content
        }));
        const { error: chErr } = await supabaseClient.from('ceritera_chapters').insert(rows);
        if (chErr) console.error('Gagal simpan bab', chErr);
      }
      return bookId;
    }

    async function cloudDeleteBook(bookId) {
      if (!supabaseClient || !currentUser) return false;
      const { error } = await supabaseClient.from('ceritera_books').delete().eq('id', bookId).eq('user_id', currentUser.id);
      if (error) { console.error('Gagal padam buku', error); return false; }
      return true;
    }

    async function cloudLoadSettings() {
      const fallback = { theme: 'koral', darkMode: false };
      if (!supabaseClient || !currentUser) return fallback;
      const { data, error } = await supabaseClient.from('ceritera_settings').select('*').eq('user_id', currentUser.id).maybeSingle();
      if (error || !data) return fallback;
      return { theme: data.theme || 'koral', darkMode: !!data.dark_mode };
    }

    async function cloudSaveProgress(bookId, chapterIdx) {
      if (!supabaseClient || !currentUser || !bookId) return;
      try {
        // IMPORTANT: upsert() overwrites every column not included, so bookmarked_chapter_index
        // must be explicitly carried forward here — otherwise every chapter change would silently
        // erase the user's bookmark.
        await supabaseClient.from('ceritera_progress').upsert({
          user_id: currentUser.id, book_id: bookId, last_chapter_index: chapterIdx,
          bookmarked_chapter_index: currentBookmarkedIndex, updated_at: new Date().toISOString()
        }, { onConflict: 'user_id,book_id' });
      } catch (e) { console.error('Gagal simpan kedudukan bacaan', e); }
    }

    async function cloudLoadProgress(bookId) {
      if (!supabaseClient || !currentUser || !bookId) return 0;
      const { data, error } = await supabaseClient.from('ceritera_progress').select('last_chapter_index').eq('user_id', currentUser.id).eq('book_id', bookId).maybeSingle();
      if (error || !data) return 0;
      return data.last_chapter_index || 0;
    }

    // ---------- seed default books into a fresh account (first login only) ----------
    async function seedDefaultBooksIfEmpty() {
      const existing = await cloudLoadBooks();
      if (existing === null) return null; // load failed, don't wipe/seed
      if (existing.length > 0) return existing;
      // brand-new account — copy the two built-in novels in so nothing is "lost"
      for (const book of defaultBooks) {
        await cloudCreateBook(book);
      }
      return await cloudLoadBooks();
    }

    async function loadLibraryData() {
      if (currentUser) {
        syncStatus = 'syncing';
        renderSyncBadge();
        const books = await seedDefaultBooksIfEmpty();
        if (books !== null) {
          featuredBooks = books;
          syncStatus = 'synced';
        } else {
          featuredBooks = defaultBooks.map(b => Object.assign({ id: uid() }, b));
          syncStatus = 'error';
        }
        const settings = await cloudLoadSettings();
        currentColorTheme = settings.theme;
        currentDarkMode = settings.darkMode;
        applyThemeToDOM();
        persistThemeLocal();
      } else {
        try {
          const raw = localStorage.getItem('ceriteraBooks');
          featuredBooks = raw ? JSON.parse(raw) : defaultBooks.map(b => Object.assign({ id: uid() }, b));
        } catch (e) {
          featuredBooks = defaultBooks.map(b => Object.assign({ id: uid() }, b));
        }
        syncStatus = 'local';
      }
      renderSyncBadge();
      renderLibrary();
    }

    function persistLocalBooks() {
      try { localStorage.setItem('ceriteraBooks', JSON.stringify(featuredBooks)); } catch (e) {}
    }

    function renderSyncBadge() {
      const el = document.getElementById('sync-badge');
      if (!el) return;
      el.className = 'sync-badge ' + syncStatus;
      const labels = { local: 'Peranti ini sahaja', syncing: 'Menyegerak\u2026', synced: 'Disegerak ke cloud', error: 'Ralat segerak' };
      el.title = labels[syncStatus] || '';
    }

    // ==================== ADD / DELETE BOOK ====================

    // Holds the chapters auto-extracted from the uploaded PDF/DOCX for the book
    // currently being added. The person never sees or edits individual chapters —
    // upload the file and it's ready to read and save.
    let pendingBookChapters = null;
    let pendingBookFileName = '';

    function openAddBookModal() {
      pendingBookChapters = null;
      pendingBookFileName = '';
      let html = '<div class="modal-overlay" onclick="closeAppModal(event)"><div class="modal" onclick="event.stopPropagation()">';
      html += '<div class="modal-header"><span class="modal-title">Tambah Buku Baharu</span><button class="close-btn" onclick="closeAppModal()">✕</button></div>';
      html += '<div id="addBookError"></div>';
      html += '<div class="form-field"><label>Nama Novel</label><input type="text" id="newBookTitle" placeholder="Tajuk buku"></div>';
      html += '<div class="form-field"><label>Nama Penulis</label><input type="text" id="newBookAuthor" placeholder="Nama penulis"></div>';
      html += '<div class="form-field"><label>Bahasa</label><select id="newBookLang"><option value="BM">Bahasa Melayu</option><option value="BI">Bahasa Inggeris</option></select></div>';
      html += '<div class="form-field"><label>Emoji (pilihan)</label><input type="text" id="newBookEmoji" placeholder="📘" maxlength="4"></div>';
      html += '<div class="form-field">';

      html += '</div>';
      html += '<div class="modal-actions"><button type="button" class="btn-cancel" onclick="closeAppModal()">Batal</button><button type="button" class="btn-lang active" id="saveBookBtn" style="flex:1; opacity:0.5;" disabled onclick="saveNewBook()">Simpan Buku</button></div>';
      html += '</div></div>';
      document.getElementById('modalRoot').innerHTML = html;

    // ==================== FILE UPLOAD (DOCX / PDF) ====================
    async function handleBookFileUpload(e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const statusEl = document.getElementById('fileUploadStatus');
      const errEl = document.getElementById('addBookError');
      const saveBtn = document.getElementById('saveBookBtn');
      const uploadLabel = document.getElementById('fileUploadLabel');
      if (errEl) errEl.innerHTML = '';
      if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '0.5'; }
      if (statusEl) statusEl.innerHTML = '<span style="display:inline-flex; align-items:center; gap:6px;"><span class="ptr-spinner spinning" style="width:14px;height:14px;border-width:2px;"></span> Membaca dan menyimpan fail\u2026</span>';
      if (uploadLabel) uploadLabel.style.pointerEvents = 'none';

      try {
        let rawText;
        const lower = file.name.toLowerCase();
        if (lower.endsWith('.docx')) {
          rawText = await extractTextFromDocx(file);
        } else if (lower.endsWith('.pdf')) {
          rawText = await extractTextFromPdf(file);
        } else {
          throw new Error('Format fail tidak disokong. Guna .docx atau .pdf sahaja.');
        }

        if (!rawText || !rawText.trim()) {
          throw new Error('Tiada teks dijumpai dalam fail ini. Jika ini PDF hasil imbasan (scan), teks tidak dapat diekstrak automatik.');
        }

        pendingBookChapters = splitIntoChapters(rawText);
        pendingBookFileName = file.name;

        // Try to guess a title from the filename if the title field is still empty
        const titleInput = document.getElementById('newBookTitle');
        if (titleInput && !titleInput.value.trim()) {
          titleInput.value = file.name.replace(/\.(docx|pdf)$/i, '').replace(/[_-]+/g, ' ').trim();
        }

        if (statusEl) statusEl.innerHTML = '<span style="color:var(--accent); font-weight:700;">\u2713 Sedia dibaca</span> \u2014 ' + pendingBookChapters.length + ' bab dikesan daripada "' + escapeHtml(file.name) + '".';
        if (uploadLabel) uploadLabel.innerHTML = '\u2713 ' + escapeHtml(file.name) + '<input type="file" accept=".docx,.pdf" style="display:none;" onchange="handleBookFileUpload(event)">';
        if (saveBtn) { saveBtn.disabled = false; saveBtn.style.opacity = '1'; }
      } catch (err) {
        pendingBookChapters = null;
        pendingBookFileName = '';
        if (statusEl) statusEl.textContent = '';
        if (errEl) errEl.innerHTML = '<div class="form-error">' + escapeHtml(err.message || 'Gagal proses fail.') + '</div>';
      } finally {
        if (uploadLabel) uploadLabel.style.pointerEvents = '';
      }
    }

    async function extractTextFromDocx(file) {
      if (!mammothReady) throw new Error('Perpustakaan pembaca DOCX gagal dimuat. Semak sambungan internet dan cuba lagi.');
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value;
    }

    async function extractTextFromPdf(file) {
      if (!pdfjsReady) throw new Error('Perpustakaan pembaca PDF gagal dimuat. Semak sambungan internet dan cuba lagi.');
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n\n';
      }
      return fullText;
    }

    // Detect lines like "Bab 1", "Bab 1: Tajuk", "Chapter 2", "CHAPTER 3 - Title" as chapter breaks.
    // Falls back to a single chapter containing everything if no such headings are found.
    function splitIntoChapters(rawText) {
      const lines = rawText.replace(/\r\n/g, '\n').split('\n');
      const chapterHeadingPattern = /^\s*(bab|chapter)\s+(\d+|[ivxlcdm]+)\b/i;

      const chapters = [];
      let current = null;
      let sawAnyHeading = false;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (chapterHeadingPattern.test(trimmed) && trimmed.length < 100) {
          if (current) chapters.push(current);
          current = { title: trimmed, contentLines: [] };
          sawAnyHeading = true;
        } else if (current) {
          current.contentLines.push(line);
        } else {
          // Text before any detected heading — label distinctly so it never collides with "Bab 1".
          current = { title: 'Pengenalan', contentLines: [] };
          current.contentLines.push(line);
        }
      });
      if (current) chapters.push(current);

      const result = chapters
        .map(c => ({ title: c.title, content: c.contentLines.join('\n').replace(/\n{3,}/g, '\n\n').trim() }))
        .filter(c => c.content.length > 0);

      if (result.length === 0) {
        // No headings detected anywhere — treat the whole document as one chapter.
        return [{ title: 'Bab 1', content: rawText.trim() }];
      }
      return result;
    }

    async function saveNewBook() {
      const title = document.getElementById('newBookTitle').value.trim();
      const author = document.getElementById('newBookAuthor').value.trim();
      const lang = document.getElementById('newBookLang').value;
      const emoji = document.getElementById('newBookEmoji').value.trim() || '📘';
      const errEl = document.getElementById('addBookError');
      errEl.innerHTML = '';

      if (!title) { errEl.innerHTML = '<div class="form-error">Sila isi nama novel.</div>'; return; }
      if (!pendingBookChapters || pendingBookChapters.length === 0) {
        errEl.innerHTML = '<div class="form-error">Sila muat naik fail .docx atau .pdf terlebih dahulu.</div>';
        return;
      }

      const newBook = { id: uid(), title, author, lang, emoji, chapters: pendingBookChapters };

      if (currentUser) {
        const realId = await cloudCreateBook(newBook);
        if (realId) newBook.id = realId;
        else errEl.innerHTML = '<div class="form-error">Gagal simpan ke cloud \u2014 buku disimpan di peranti ini sahaja.</div>';
      }
      featuredBooks.push(newBook);
      persistLocalBooks();
      closeAppModal();
      currentPage = Math.max(1, Math.ceil(featuredBooks.length / booksPerPage));
      renderLibrary();
    }

    function confirmDeleteBook(bookId) {
      const book = featuredBooks.find(b => b.id === bookId);
      if (!book) return;
      let html = '<div class="modal-overlay" onclick="closeAppModal(event)"><div class="modal" onclick="event.stopPropagation()">';
      html += '<div class="modal-header"><span class="modal-title">Padam buku?</span><button class="close-btn" onclick="closeAppModal()">✕</button></div>';
      html += '<div style="font-size:13.5px;color:var(--muted);margin-bottom:14px;">"' + escapeHtml(book.title) + '" akan dipadam serta semua babnya. Tindakan ini tidak boleh dibatalkan.</div>';
      html += '<div class="modal-actions"><button type="button" class="btn-cancel" onclick="closeAppModal()">Batal</button><button type="button" class="btn-lang active" style="flex:1; background:#c0453d; border-color:#c0453d;" onclick="performDeleteBook(\'' + bookId + '\')">Padam</button></div>';
      html += '</div></div>';
      document.getElementById('modalRoot').innerHTML = html;
    }

    async function performDeleteBook(bookId) {
      if (currentUser) await cloudDeleteBook(bookId);
      featuredBooks = featuredBooks.filter(b => b.id !== bookId);
      persistLocalBooks();
      closeAppModal();
      renderLibrary();
    }

    function closeAppModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('modalRoot').innerHTML = '';
    }

    // ==================== AUTH ====================
    let authMode = 'signin';

    function renderAuthScreen(errorMsg) {
      const configured = !!supabaseClient;
      let html = '<div class="auth-page"><div class="auth-card">';
      html += '<div class="auth-title">Ceritera</div>';
      html += '<div class="auth-sub">Perpustakaan peribadi anda, di mana-mana peranti</div>';
      if (!configured && supabaseLoadError) {
        html += '<div class="auth-note">Tak dapat sambung ke perkhidmatan cloud \u2014 mungkin internet terputus atau pemesong iklan menyekat cdn.jsdelivr.net. Boleh guna Ceritera di peranti ini sahaja buat sementara.</div>';
      } else if (!configured) {
        html += '<div class="auth-note">Sambungan cloud belum disediakan.</div>';
      }
      if (errorMsg) html += '<div class="auth-error">' + escapeHtml(errorMsg) + '</div>';
      html += '<div class="auth-field"><label>Emel</label><input type="email" id="auth-email" placeholder="anda@emel.com" autocomplete="email"></div>';
      html += '<div class="auth-field"><label>Kata laluan</label><input type="password" id="auth-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="' + (authMode === 'signup' ? 'new-password' : 'current-password') + '"></div>';
      html += '<button class="auth-btn" id="auth-submit-btn" onclick="handleAuthSubmit()" ' + (configured ? '' : 'disabled') + '>' + (authMode === 'signup' ? 'Daftar & Mula Baca' : 'Log Masuk') + '</button>';
      html += '<div class="auth-switch">';
      if (authMode === 'signup') html += 'Dah ada akaun? <button onclick="switchAuthMode(\'signin\')">Log masuk</button>';
      else html += 'Belum ada akaun? <button onclick="switchAuthMode(\'signup\')">Daftar</button>';
      html += '</div>';
      html += '<div class="auth-skip"><button onclick="skipAuth()">Guna tanpa cloud (peranti ini sahaja)</button></div>';
      html += '</div></div>';
      document.getElementById('authRoot').innerHTML = html;
    }

    function switchAuthMode(mode) { authMode = mode; renderAuthScreen(); }

    function skipAuth() {
      document.getElementById('authRoot').innerHTML = '';
      document.getElementById('authRoot').style.display = 'none';
      document.getElementById('mainPage').style.display = '';
      loadLibraryData();
    }

    async function handleAuthSubmit() {
      const email = (document.getElementById('auth-email').value || '').trim();
      const password = document.getElementById('auth-password').value || '';
      if (!email || !password) { renderAuthScreen('Sila isi emel dan kata laluan.'); return; }
      const btn = document.getElementById('auth-submit-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Sila tunggu\u2026'; }
      try {
        if (authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          if (data.user && !data.session) {
            renderAuthScreen('Emel pengesahan telah dihantar. Sila semak emel anda, kemudian log masuk.');
            authMode = 'signin';
            return;
          }
          currentUser = data.user;
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
        }
        enterApp();
      } catch (err) {
        renderAuthScreen(err.message || 'Log masuk gagal. Sila cuba lagi.');
      }
    }

    function enterApp() {
      document.getElementById('authRoot').innerHTML = '';
      document.getElementById('authRoot').style.display = 'none';
      document.getElementById('mainPage').style.display = '';
      loadLibraryData();
      initPullToRefresh();
    }

    // ==================== PULL TO REFRESH ====================
    let ptrBound = false;
    function initPullToRefresh() {
      if (ptrBound) return;
      ptrBound = true;
      const indicator = document.getElementById('ptr-indicator');
      const spinner = document.getElementById('ptr-spinner');
      let startY = 0;
      let pulling = false;
      let triggered = false;
      const THRESHOLD = 70;

      document.addEventListener('touchstart', (e) => {
        const libraryVisible = document.getElementById('libraryView').style.display !== 'none';
        if (libraryVisible && window.scrollY <= 0) {
          startY = e.touches[0].clientY;
          pulling = true;
          triggered = false;
        } else {
          pulling = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 0 && window.scrollY <= 0) {
          const capped = Math.min(dy, 90);
          indicator.classList.add('visible');
          indicator.style.height = capped + 'px';
          spinner.classList.toggle('spinning', capped >= THRESHOLD);
          triggered = capped >= THRESHOLD;
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!pulling) return;
        pulling = false;
        if (triggered) {
          spinner.classList.add('spinning');
          indicator.style.height = '50px';
          loadLibraryData().then(() => {
            indicator.classList.remove('visible');
            indicator.style.height = '0px';
            spinner.classList.remove('spinning');
          });
        } else {
          indicator.classList.remove('visible');
          indicator.style.height = '0px';
        }
      });
    }

    function handleLogout() {
      if (supabaseClient && currentUser) supabaseClient.auth.signOut();
      currentUser = null;
      featuredBooks = [];
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('authRoot').style.display = '';
      authMode = 'signin';
      renderAuthScreen();
    }

    async function initAuth() {
      if (!supabaseClient) { renderAuthScreen(); return; }
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session && data.session.user) {
        currentUser = data.session.user;
        enterApp();
      } else {
        renderAuthScreen();
      }
    }

    // ---------- Init ----------
    initAuth();
  </script>
</body>
</html>
